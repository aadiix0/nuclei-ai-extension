<!DOCTYPE html>
<html>
  <head>
    <title>Finder</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Finder</h1>
        <div class="theme-switch-wrapper">
          <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"></div>
          </label>
        </div>
      </div>
      <div class="main">
        <div class="section">
          <h3>Link Gopher</h3>
          <button id="extract-links-btn">Extract All Links</button>
          <button id="extract-domains-btn">Extract Domains</button>
        </div>
        <div class="section">
          <h3>FindSomething</h3>
          <button id="scan-btn">Find Secrets</button>
        </div>
        <div id="results"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
